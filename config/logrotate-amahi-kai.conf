# Logrotate config for Amahi-kai logs.
# Installed as /etc/logrotate.d/amahi-kai by bin/amahi-install-helper.
#
/opt/amahi-kai/log/production.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# The privileged helper's audit log (one JSON line per call).
/var/log/amahi-kai/helper.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root amahi
}
