name: bitTube
description: Your YouTube channels and streaming services in one place, with YouTube ad-free.
category: media
logo: https://cdn.jsdelivr.net/gh/CatDogBark/amahi-kai-apps@main/logos/bittube.svg
releases: https://github.com/CatDogBark/bitTube/releases/tag/v{version}
image: ghcr.io/catdogbark/bittube:0.1.7@sha256:524305963fed2b0a6e6c3f09a1c68ecf2d3b50d72aa1697d8973c3bc2bc8941d
run_as: app
web_port: 8484
memory: 1g
# Downloads go into a share given read and write (one Greyhole doesn't pool); bitTube's own
# Settings then point at /shares/<name>. Its API keys and choices are asked for in its Settings.
writes_shares: true
ports:
  - { host: 8484, container: 8080 }
folders:
  - { name: data, path: /data }
environment:
  TZ: "{{timezone}}"
