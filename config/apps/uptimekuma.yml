name: Uptime Kuma
description: Watches your websites, servers and services, and tells you when one goes down.
sign_in: "Its first page asks which database to use (SQLite is the simple one), then for the admin account."
category: monitoring
logo: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/uptime-kuma.png
releases: https://github.com/louislam/uptime-kuma/releases/tag/{version}
image: louislam/uptime-kuma:2.5.5-rootless@sha256:c4e17ce033deb811aff8a61a5f8f736f35b1bd937458ddeec46c59ca190f0e03
run_as: app
# Its ping wants raw sockets, which apps don't get: Amahi-kai mounts a copy that pings without.
ping: /usr/bin/ping
web_port: 3001
memory: 512m
ports:
  - { host: 3001, container: 3001 }
folders:
  - { name: data, path: /app/data }
environment:
  TZ: "{{timezone}}"
