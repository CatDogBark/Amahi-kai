name: Uptime Kuma
description: Watches your websites, servers and services, and tells you when one goes down.
category: monitoring
logo: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/uptime-kuma.png
image: louislam/uptime-kuma:2.5.5-rootless@sha256:c4e17ce033deb811aff8a61a5f8f736f35b1bd937458ddeec46c59ca190f0e03
run_as: app
web_port: 3001
memory: 512m
ports:
  - { host: 3001, container: 3001 }
folders:
  - { name: data, path: /app/data }
environment:
  TZ: "{{timezone}}"
