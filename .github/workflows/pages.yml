name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [site/**, lib/site_apps.rb, script/site-apps, .github/workflows/pages.yml]
  # Daily too, so an app added to the catalog shows on the site within a day.
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time: a newer one waits for the one running.
concurrency:
  group: pages
  cancel-in-progress: false

# The job stops after 10 minutes: a step that hangs (an apt mirror that stopped answering
# held three jobs for 18 minutes on 2026-10-27) fails then, instead of after GitHub's 6 hours.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The site serves the one-line installer: one bash won't read never goes up.
      - name: install.sh is valid bash
        run: bash -n site/install.sh
      # The app grid lists what the catalog has today: each app's logo, name and description.
      - uses: actions/checkout@v4
        with:
          repository: CatDogBark/amahi-kai-apps
          path: catalog
      - name: The app grid from the catalog
        run: ruby script/site-apps --catalog catalog/apps
      # Each stylesheet and script is linked with a hash of its content. Cloudflare tells browsers
      # to keep them for 4 hours, so a page that changed along with its stylesheet would otherwise
      # be drawn with the old one until then. The last line lists the links, and fails if none is.
      - name: Stylesheets and scripts linked by their content
        run: |
          for path in site/assets/*.css site/assets/*.js; do
            link=${path#site}
            sed -i "s|\"$link\"|\"$link?v=$(sha256sum "$path" | cut -c1-12)\"|g" site/index.html site/_layouts/*.html
          done
          grep -h -o '"/assets/[^"]*?v=[0-9a-f]*"' site/index.html site/_layouts/*.html
      - uses: actions/configure-pages@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
