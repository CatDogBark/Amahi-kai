name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  models:
    name: Model Specs
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      BUNDLE_JOBS: 4
      BUNDLE_WITHOUT: production
      SIMPLECOV_COMMAND_NAME: models
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libmariadb-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Prepare DB
        run: |
          mkdir -p tmp/cache/tmpfiles tmp/pids log
          bundle exec rails db:schema:load
      # spec/services and spec/helpers had no job, so they never ran
      - run: bundle exec rspec spec/models/ spec/services/ spec/helpers/ --tag ~docker --format documentation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-models
          path: coverage/
          include-hidden-files: true
          if-no-files-found: warn

  requests:
    name: Request Specs
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      BUNDLE_JOBS: 4
      BUNDLE_WITHOUT: production
      SIMPLECOV_COMMAND_NAME: requests
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libmariadb-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Prepare DB
        run: |
          mkdir -p tmp/cache/tmpfiles tmp/pids log
          bundle exec rails db:schema:load
      - name: Run request specs
        run: bundle exec rspec spec/requests/ --tag ~integration --format documentation --format json --out tmp/rspec-requests.json 2>&1 | tee tmp/rspec-requests.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-requests
          path: coverage/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Show failures
        if: always()
        run: |
          echo "::group::RSpec Request Failures"
          grep -B5 "FAILED\|Failure/Error\|expected\|got:\|NoMethodError\|NameError\|undefined method\|uninitialized constant" tmp/rspec-requests.log | head -200 || true
          echo "::endgroup::"
          echo "::group::RSpec Request Summary"
          tail -20 tmp/rspec-requests.log
          echo "::endgroup::"
          ruby -rjson -e 'JSON.parse(File.read("tmp/rspec-requests.json"))["examples"].select{|e|e["status"]=="failed"}.each{|e| puts "::error::#{e["full_description"]}: #{e.dig("exception","message").to_s[0,200]}"}' || true
          echo "::group::Exceptions from log/test.log"
          grep -E -A8 "^[A-Z][A-Za-z0-9:]*(Error|Exception) \\(" log/test.log | head -150 || true
          echo "::endgroup::"
          # Match ", 0 failures" exactly: a bare "0 failures" also matches "10 failures".
          grep -qE "[0-9]+ examples?, 0 failures" tmp/rspec-requests.log

  lib:
    name: Lib Specs
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      BUNDLE_JOBS: 4
      BUNDLE_WITHOUT: production
      SIMPLECOV_COMMAND_NAME: lib
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libmariadb-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Prepare DB
        run: |
          mkdir -p tmp/cache/tmpfiles tmp/pids log
          bundle exec rails db:schema:load
      - name: Run lib specs
        run: bundle exec rspec spec/lib/ --tag ~integration --format documentation --format json --out tmp/rspec-lib.json 2>&1 | tee tmp/rspec-lib.log
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lib
          path: coverage/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Show failures
        if: always()
        run: |
          echo "::group::RSpec Lib Failures"
          grep -B5 "FAILED\|Failure/Error\|expected\|got:\|NoMethodError\|NameError\|undefined method\|uninitialized constant" tmp/rspec-lib.log | head -200 || true
          echo "::endgroup::"
          echo "::group::RSpec Lib Summary"
          tail -20 tmp/rspec-lib.log
          echo "::endgroup::"
          ruby -rjson -e 'JSON.parse(File.read("tmp/rspec-lib.json"))["examples"].select{|e|e["status"]=="failed"}.each{|e| puts "::error::#{e["full_description"]}: #{e.dig("exception","message").to_s[0,200]}"}' || true
          echo "::group::Exceptions from log/test.log"
          grep -E -A8 "^[A-Z][A-Za-z0-9:]*(Error|Exception) \\(" log/test.log | head -150 || true
          echo "::endgroup::"
          # Match ", 0 failures" exactly: a bare "0 failures" also matches "10 failures".
          grep -qE "[0-9]+ examples?, 0 failures" tmp/rspec-lib.log

  coverage:
    name: Coverage Report
    needs: [models, requests, lib]
    if: always()
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      BUNDLE_JOBS: 4
      BUNDLE_WITHOUT: production
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libmariadb-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Download all coverage results
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-parts/
      - name: Merge and report coverage
        run: |
          mkdir -p coverage
          ruby -e '
            require "json"

            files = Dir["coverage-parts/**/.resultset.json"]
            puts "Found #{files.length} coverage result files"
            exit 0 if files.empty?

            # Merge line coverage across all jobs
            merged_coverage = {}
            files.each do |f|
              data = JSON.parse(File.read(f))
              puts "  Loaded: #{f} (#{data.keys.join(", ")})"
              data.each do |_cmd, result|
                (result["coverage"] || {}).each do |file, file_data|
                  lines = file_data.is_a?(Hash) ? file_data["lines"] : file_data
                  next unless lines.is_a?(Array)
                  if merged_coverage[file]
                    lines.each_with_index do |val, i|
                      next if val.nil?
                      merged_coverage[file][i] = [(merged_coverage[file][i] || 0), val].max
                    end
                  else
                    merged_coverage[file] = lines.dup
                  end
                end
              end
            end

            # Calculate totals
            total = 0; covered = 0; missed = 0
            by_group = Hash.new { |h,k| h[k] = {total: 0, covered: 0} }

            merged_coverage.each do |file, lines|
              relevant = lines.each_with_index.select { |v, _| !v.nil? }
              file_total = relevant.length
              file_covered = relevant.count { |v, _| v > 0 }
              total += file_total
              covered += file_covered

              group = case file
                      when /app\/models/ then "Models"
                      when /app\/controllers/ then "Controllers"
                      when /app\/helpers/ then "Helpers"
                      when /app\/services/ then "Services"
                      when /lib\// then "Lib"
                      else "Other"
                      end
              by_group[group][:total] += file_total
              by_group[group][:covered] += file_covered
            end

            pct = total > 0 ? (covered.to_f / total * 100).round(1) : 0

            # Console output
            puts "\n#{"=" * 50}"
            puts "COVERAGE: #{pct}% (#{covered}/#{total} lines)"
            puts "#{"=" * 50}"
            by_group.sort_by { |k, _| k }.each do |group, data|
              g_pct = data[:total] > 0 ? (data[:covered].to_f / data[:total] * 100).round(1) : 0
              puts "  #{group.ljust(15)} #{g_pct}% (#{data[:covered]}/#{data[:total]})"
            end
            puts

            # Step summary for GitHub UI
            summary = File.open(ENV["GITHUB_STEP_SUMMARY"], "a")
            summary.puts "## 📊 Coverage Report"
            summary.puts ""
            summary.puts "**Overall: #{pct}%** (#{covered}/#{total} lines)"
            summary.puts ""
            summary.puts "| Group | Coverage | Lines |"
            summary.puts "|-------|----------|-------|"
            by_group.sort_by { |k, _| k }.each do |group, data|
              g_pct = data[:total] > 0 ? (data[:covered].to_f / data[:total] * 100).round(1) : 0
              summary.puts "| #{group} | #{g_pct}% | #{data[:covered]}/#{data[:total]} |"
            end
            summary.close

            # Write merged data for artifact
            File.write("coverage/results.json", JSON.pretty_generate({
              total_lines: total, covered_lines: covered, percentage: pct,
              groups: by_group, files: merged_coverage.length
            }))
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  mariadb:
    # Production runs on MariaDB; the other jobs use SQLite. This catches SQL that
    # only one of them accepts. DATABASE_URL replaces the test database settings.
    name: Specs on MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11  # what Ubuntu 24.04 ships
        env:
          MARIADB_ROOT_PASSWORD: ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      RAILS_ENV: test
      BUNDLE_JOBS: 4
      BUNDLE_WITHOUT: production
      DATABASE_URL: mysql2://root:ci-only@127.0.0.1:3306/amahi_test
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libmariadb-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Prepare DB
        run: |
          mkdir -p tmp/cache/tmpfiles tmp/pids log
          bundle exec rails db:create db:schema:load
      - name: Model, service and helper specs
        run: bundle exec rspec spec/models/ spec/services/ spec/helpers/ --tag ~docker
      - name: Request specs
        run: bundle exec rspec spec/requests/ --tag ~integration

  lint:
    name: Lint & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      # Pinned so a new cop or check can't fail CI without a code change.
      # Bump them on purpose, then fix or record what they find.
      - name: Install lint tools
        run: |
          gem install --no-document rubocop:1.91.0 rubocop-rails:2.38.0 rubocop-rspec:3.10.2
          gem install --no-document brakeman:8.1.0 bundler-audit:0.9.3
      # Fails on new offenses; existing ones are listed in .rubocop_todo.yml.
      - name: RuboCop
        run: rubocop --parallel --format github
      # Fails on any warning not in config/brakeman.ignore (each entry there has a note).
      - name: Brakeman
        run: brakeman --no-pager -q
      # Fails on any known advisory for a locked gem; update the gem to clear it.
      - name: Gem advisories
        run: bundle-audit check --update
      # The root helper must load with the standard library alone (no gems, no Bundler).
      - name: Privileged helper self-test
        run: ruby --disable-gems libexec/amahi-helper --self-test
      # A sudoers file visudo rejects would be kept off the NAS; catch it here first.
      - name: Sudoers syntax
        run: sudo visudo -cf config/sudoers/amahi-kai
